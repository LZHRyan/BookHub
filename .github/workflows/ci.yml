name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        env:
          SECRET_KEY: ci-secret-key-0123456789abcdef
        run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # 起一个真实实例，把三个冒烟脚本跑一遍：pytest 用的是进程内 TestClient，
    # 覆盖不到 alembic → bootstrap → uvicorn → HTTP 这一整条启动链路。
    env:
      SECRET_KEY: ci-smoke-secret-key-0123456789abcdef
      DATABASE_URL: sqlite:///./data/bookhub.db
      DATA_DIR: ./data
      BOOKHUB_INITIAL_ADMIN_USER: admin
      BOOKHUB_INITIAL_ADMIN_PASSWORD: AdminPass123
      SEED_DEMO: "true"
      # 应用启动时把这个明文 Token 幂等落库（scopes=admin），供管理 API 冒烟使用
      ADMIN_API_TOKEN: bh_ci_smoke_token_0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate database and create initial admin
        run: |
          mkdir -p data
          python -m alembic upgrade head
          python -m app.bootstrap

      - name: Start server and wait for /healthz
        run: |
          nohup python -m uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
              echo "服务已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::服务在 60s 内没有通过 /healthz" >&2
          cat uvicorn.log >&2
          exit 1

      - name: Smoke - public read-only endpoints
        run: python scripts/smoke.py --base-url http://127.0.0.1:8000 --api-key "$ADMIN_API_TOKEN"

      - name: Smoke - web admin full lifecycle
        run: |
          python scripts/e2e_admin_flow.py \
            --base-url http://127.0.0.1:8000 \
            --username "$BOOKHUB_INITIAL_ADMIN_USER" \
            --password "$BOOKHUB_INITIAL_ADMIN_PASSWORD" \
            --api-key "$ADMIN_API_TOKEN"

      - name: Smoke - management API lifecycle
        run: python scripts/api_smoke.py --base-url http://127.0.0.1:8000 --token "$ADMIN_API_TOKEN"

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: uvicorn.log

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bookhub:ci .
