[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "alembic/versions", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = [
    "B008",  # FastAPI 依赖注入就是函数调用默认值
    "E501",  # 长行交给格式化处理
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM117"]
