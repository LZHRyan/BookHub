{% extends "base.html" %}
{% block content %}
  <div class="card error-page">
    <div class="error-code">{{ status_code }}</div>
    <h1>{% if status_code == 404 %}这个页面不存在{% elif status_code == 403 %}没有访问权限{% elif status_code == 401 %}请先登录{% else %}出了点问题{% endif %}</h1>
    <p>{{ message }}</p>
    <p class="request-id">请求编号 <span class="mono">{{ request_id }}</span></p>
    <div class="toolbar" style="justify-content:center;">
      <a class="btn btn-primary" href="{{ url_for('index') }}">返回首页</a>
      <button type="button" class="btn" data-back>回到上一页</button>
    </div>
  </div>
{% endblock %}
